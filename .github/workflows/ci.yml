name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci --omit=dev || true
      - name: Run unit tests
        run: node --test
      - name: Lint (optional)
        run: echo "No linter configured"
