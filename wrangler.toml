name = "makavelithedonn-clone-rgosuksa"
main = "workers/worker.js"
compatibility_date = "2026-09-01"

[env]

# Bindings: adjust the values locally / in Cloudflare dashboard
[vars]
# DEV_SHOW_OTP=1 makes the worker return the OTP in /api/request-otp response for local testing ONLY
DEV_SHOW_OTP = "0"
# SMS provider (twilio/vonage) - set API key via wrangler secret put SMS_API_KEY
SMS_PROVIDER = "twilio"
# HMAC secret - set via wrangler secret put HMAC_SECRET
HMAC_SECRET = "set-via-secret"

[[kv_namespaces]]
binding = "OTP_KV"
id = "d1b917d366f34b0a8f132b58c294a69a"

[[kv_namespaces]]
binding = "RATE_KV"
id = "a7ee726af5284e3ebb5649847bb0bde4"

[[d1_databases]]
binding = "DB"
database_name = "rgosuksa_db"
database_id = "4fa3a192-b0dc-47f5-9ede-b25c7d1fb469"

# Do NOT commit secrets. Set HMAC_SECRET with `wrangler secret put HMAC_SECRET` or via GitHub Actions secrets.
